    const score = h("div", { class: "tally" });
    const stage = h("div", {});
    const settingsBox = h("details", { class: "panel drill-settings" });
    const drawScore = () => score.replaceChildren(
      h("span", {}, `${st.right} / ${st.answered} right`),
      h("span", {}, st.streak > 1 ? `streak ${st.streak}` : ""));

    app().replaceChildren(
      h("div", { class: "row" }, h("a", { href: "#/", class: "muted" }, "← Home")),
      h("div", { class: "row", style: { marginTop: "8px" } },
        h("h1", { style: { flex: "1" } }, scope.mode === "only" ? `New in Unit ${scope.unit}` : `Units 1–${scope.unit}`),
        h("a", { class: "btn small", href: "#/ndrill" }, "Change unit")),
      settingsBox, score, stage);

    function drawSettings() {
      const toggle = (list, key) => {
        const on = list.includes(key);
        return h("button", { class: "btn small", "aria-pressed": String(on), onclick: () => {
          const i = list.indexOf(key);
          if (i >= 0) { if (list.length > 1) list.splice(i, 1); } else list.push(key);
          saveSettings(); drawSettings(); next();
        } });
      };
      const open = settingsBox.open;
      settingsBox.replaceChildren(
        h("summary", {}, "Settings"),
        h("div", { class: "options", style: { marginTop: "12px" } },
          h("b", {}, "Declensions"),
          h("div", { class: "row" }, DECLS.map(([k, label]) => append(toggle(settings.decls, k), [label]))),
          h("b", {}, "Question types"),
          h("div", { class: "row" }, NOUN_TYPES.map(([k, label]) => append(toggle(settings.types, k), [label]))),
          h("div", { class: "muted", style: { fontSize: "13px" } }, NOUN_TYPES.map(t => h("div", {}, h("b", {}, t[1]), ": ", t[2]))),
          h("b", {}, "Typed answers"),
          h("div", { class: "row" },
            ["strict", "lenient"].map(g => h("button", { class: "btn small", "aria-pressed": String(settings.grading === g),
              onclick: () => { settings.grading = g; saveSettings(); drawSettings(); } }, g === "strict" ? "Accents count" : "Ignore accents"))),
          h("div", { class: "muted", style: { fontSize: "13px" } }, "Vowel length is never graded: macrons (ᾱ ῑ ῡ) are shown in answers but you never have to type them."),
          h("div", { class: "row" },
            h("button", { class: "btn small ghost", onclick: () => confirmModal("Reset drill history?",
              "Forget which forms you've missed, so every form is weighted equally again.", "Reset",
              () => { for (const k of Object.keys(stats)) delete stats[k]; nStore.set("ndrill-stats", stats); toast("History reset"); }) }, "Reset history"))));
      settingsBox.open = open;
    }

    const pool = () => nounPoolCache.filter(it => inScope(it, scope) && settings.decls.includes(family(it.decl)));
    // Every form of this lemma: one printed form can realise several case/number slots.
    const byLemma = new Map();
    const lemmaItems = lemma => {
      if (!byLemma.has(lemma)) byLemma.set(lemma, nounPoolCache.filter(it => it.lemma === lemma && it.unit <= scope.unit));
      return byLemma.get(lemma);
    };
    const parsesOf = (form, lemma) => lemmaItems(lemma).filter(it => baseNorm(it.form) === baseNorm(form));

    function weight(it) {
      const s = stats[it.id];
      if (!s) return 2;
      return (s.missed ? 4 : 0) + 1 / (1 + s.streak);
    }
    function choose(items) {
      const fresh = items.filter(it => !st.recent.includes(it.id));
      const cand = fresh.length ? fresh : items;
      let r = Math.random() * cand.reduce((a, it) => a + weight(it), 0);
      for (const it of cand) { r -= weight(it); if (r <= 0) return it; }
      return cand[cand.length - 1];
    }
    function record(it, ok) {
      const s = stats[it.id] || (stats[it.id] = { seen: 0, right: 0, streak: 0, missed: false });
      s.seen++; if (ok) { s.right++; s.streak++; if (s.streak >= 2) s.missed = false; } else { s.streak = 0; s.missed = true; }
      nStore.set("ndrill-stats", stats);
      st.answered++; if (ok) { st.right++; st.streak++; } else st.streak = 0;
      drawScore();
    }

    function next() {
      state.onKey = null;
      const items = pool();
      if (!items.length) {
        stage.replaceChildren(h("div", { class: "empty" }, "No forms for the chosen units and declensions. Pick another unit or turn on a declension in Settings."));
        return;
      }
      for (let tries = 0; tries < 30; tries++) {
        const it = choose(items);
        if (!settings.types.length) continue;
        st.recent = [it.id, ...st.recent].slice(0, Math.min(6, Math.floor(items.length / 2)));
        const t = pick1(settings.types);
        st.cur = it;
        return ({ parse: askParse, pick: askPick, build: askBuild }[t] || askParse)(it);
      }
      stage.replaceChildren(h("div", { class: "empty" }, "No question fits these forms. Turn on another question type."));
    }

    // ---- shared pieces
    const source = it => `⚙ Built by rule from H&Q's ${it.section} endings + the persistent-accent rule. Not printed in H&Q, so check it before you rely on it.`;
    function answerBlock(form, it) {
      const parses = parsesOf(form, it.lemma);
      return h("div", {}, parses.map(p => h("div", { class: "drill-parse" },
        h("div", { class: "ans" }, p.form),
        h("div", {}, h("b", {}, describe(p)), " of ", h("span", { class: "greek" }, p.lemma),
          h("span", { class: "muted", style: { fontSize: "13px" } }, ` · ${GENDER[p.gender]}, ${p.declLabel}`)),
        h("div", { class: "muted", style: { fontSize: "13px" } }, source(p)))),
        parses.length > 1 ? h("div", { class: "muted", style: { fontSize: "13px" } }, `This form fills ${parses.length} slots; context decides.`) : null);
    }
    const nextBtn = () => {
      const b = h("button", { class: "btn primary", onclick: next }, "Next →");
      state.onKey = e => { if (e.key === "Enter" && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); next(); } };
      setTimeout(() => b.focus(), 0);
      return h("div", { class: "row", style: { marginTop: "14px" } }, b);
    };
    const frame = (label, prompt, body) => stage.replaceChildren(h("div", { class: "qcard" },
      h("div", { class: "qlabel" }, label, h("span", { class: "built-badge", title: "Built by rule, not printed in H&Q" }, "⚙ built")),
      h("div", { class: "prompt" }, prompt), body));
    const bigGreek = s => h("div", { class: "card-text greek size-xl", lang: "grc" }, s);
    const descPrompt = it => h("div", {},
      h("div", { class: "card-text greek size-l", lang: "grc" }, it.lemma),
      h("div", { class: "size-m" }, describe(it)),
      h("div", { class: "muted", style: { fontSize: "13px" } }, `${GENDER[it.gender]} · ${it.declLabel}`));

    // ---- Parse
    function askParse(it) {
      const form = it.form;
      const pickd = { caseName: null, number: null };
      const fb = h("div", {});
      const groups = h("div", { class: "drill-groups" });
      let done = false;
      const ready = () => pickd.caseName && pickd.number;
      const check = h("button", { class: "btn primary", disabled: true, onclick: () => grade_() }, "Check");
      function draw() {
        const grp = (key, values, labels) => h("div", { class: "drill-group" },
          h("div", { class: "lbl" }, key === "caseName" ? "Case" : "Number"),
          h("div", { class: "row" }, values.map((v, i) => h("button", { class: "btn small", disabled: done,
            "aria-pressed": String(pickd[key] === v), onclick: () => { pickd[key] = v; draw(); } }, labels[i]))));
        groups.replaceChildren(grp("caseName", CASES, CASES.map(cap)), grp("number", NUMS, NUMS.map(cap)));
        check.disabled = !ready() || done;
      }
      function grade_() {
        if (!ready() || done) return;
        done = true;
        const ok = parsesOf(form, it.lemma).some(p => p.caseName === pickd.caseName && p.number === pickd.number);
        record(it, ok);
        draw();
        fb.replaceChildren(h("div", { class: "feedback " + (ok ? "good" : "bad") }, ok ? "Correct!" : "Not quite.",
          h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, answerBlock(form, it))), nextBtn());
      }
      draw();
      state.onKey = e => { if (e.key === "Enter" && ready() && !done) { e.preventDefault(); grade_(); } };
      frame("Parse: name the case and number",
        h("div", {}, bigGreek(form), h("div", { class: "size-m greek", style: { marginTop: "4px" } }, ""),
          h("div", { class: "muted", style: { fontSize: "13px" } }, `of ${it.lemma} · ${GENDER[it.gender]}, ${it.declLabel}`)),
        h("div", {}, groups, h("div", { class: "row", style: { marginTop: "12px" } }, check), fb));
    }

    // ---- multiple choice helper
    function choiceQuestion(label, prompt, options, correctIdx, it, form) {
      const fb = h("div", {});
      let done = false;
      const buttons = options.map((o, i) => h("button", { class: "choice", onclick: () => choose_(i) },
        h("span", { class: "num" }, i + 1), h("span", { lang: "grc" }, o)));
      function choose_(i) {
        if (done) return;
        done = true;
        const ok = i === correctIdx;
        buttons[correctIdx].classList.add("right");
        if (!ok) buttons[i].classList.add("wrong");
        record(it, ok);
        fb.replaceChildren(h("div", { class: "feedback " + (ok ? "good" : "bad") }, ok ? "Correct!" : "Not quite.",
          h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, answerBlock(form, it))), nextBtn());
      }
      state.onKey = e => { const n = Number(e.key); if (!done && n >= 1 && n <= options.length) choose_(n - 1); };
      frame(label, prompt, h("div", {}, h("div", { class: "choices" }, buttons), fb));
    }

    // ---- Find it
    function askPick(it) {
      const form = it.form;
      // A distractor must be a different form that doesn't also fit this case+number.
      const cands = lemmaItems(it.lemma).filter(o => baseNorm(o.form) !== baseNorm(form)
        && !parsesOf(o.form, o.lemma).some(p => sameSlot(p, it)));
      const seen = new Set(), ds = [];
      for (const o of shuffle(cands)) {
        if (seen.has(baseNorm(o.form))) continue;
        seen.add(baseNorm(o.form)); ds.push(o.form);
        if (ds.length >= 3) break;
      }
      const options = shuffle([form, ...ds]);
      choiceQuestion("Find it", descPrompt(it), options, options.indexOf(form), it, form);
    }

    // ---- Write it
    function askBuild(it) {
      const fb = h("div", {});
      let done = false;
      const inp = h("input", { class: "field", "data-greek": "", lang: "grc", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
        placeholder: "Type the Greek form", "aria-label": "Greek form" });
      const check = () => {
        if (done || !inp.value.trim()) return;
        done = true; inp.disabled = true;
        // Vowel length isn't tested: macrons are shown in answers but never required.
        const res = grade(noLength(inp.value), noLength(it.form), settings.grading);
        record(it, res === "right");
        fb.replaceChildren(h("div", { class: "feedback " + (res === "right" ? "good" : res === "close" ? "close" : "bad") },
          res === "right" ? "Correct!" : res === "close" ? "Close: check the accents, breathings and iota subscripts." : "Not quite.",
          h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, answerBlock(it.form, it))), nextBtn());
      };
      state.onKey = e => { if (e.key === "Enter" && !done) { e.preventDefault(); check(); } };
      frame("Write it", descPrompt(it), h("div", {}, inp,
        h("div", { class: "muted", style: { fontSize: "13px", marginTop: "6px" } }, "Optional letters like (ν) can be typed or left out. Macrons aren't required."),
        h("div", { class: "row", style: { marginTop: "12px" } }, h("button", { class: "btn primary", onclick: check }, "Check")), fb));
      setTimeout(() => inp.focus(), 0);
    }

    drawSettings(); drawScore(); next();
  }

  window.nounDrillView = nounDrillView;
})();

/* Vocabulary quiz: an endless quiz on the H&Q vocabulary in vocab.json
   (every headword transcribed from H&Q's printed vocabulary pages, by unit).
   It only shows and grades the words and glosses it was given; it builds nothing.
   Reuses helpers defined in app.js (nfc, h, append, shuffle, grade, toast,
   confirmModal, app, state) and drill.js (noLength, pick1). */
"use strict";

const VOCAB_CATS = [
  ["verb", "Verbs"], ["noun", "Nouns"], ["adjective", "Adjectives"],
  ["preposition", "Prepositions"], ["little", "Little words"],
];
const VOCAB_TYPES = [
  ["g2e", "Greek → English", "See the Greek word → type its meaning"],
  ["pick", "English → Greek (choose)", "See a meaning → pick the Greek word from four"],
  ["type", "English → Greek (write)", "See a meaning → type the Greek word"],
];
const CAT_LABEL = Object.fromEntries(VOCAB_CATS);

const vocabStore = {
  get(key, dflt) { try { return Object.assign(dflt, JSON.parse(localStorage.getItem(key) || "{}")); } catch { return dflt; } },
  set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch { /* private mode */ } },
};
let vocabCache = null;

// The quizzed lemma: the first comma/middle-dot part of a headword, with any
// parenthetical note dropped. "ἀγορᾱ́, ἀγορᾶς, ἡ" → "ἀγορᾱ́"; "παιδεύω, …" → "παιδεύω";
// "ἐκ, ἐξ" → "ἐκ"; "ἐπιβουλεύω (under βουλεύω)" → "ἐπιβουλεύω".
const lemmaOf = g => nfc(String(g).split(/[,·]/)[0].replace(/\([^)]*\)/g, "").replace(/\s+/g, " ").trim());

// One English meaning, normalized: parentheticals, case tags and §refs dropped,
// a leading "to/the/a/an" trimmed, punctuation flattened.
function normMeaning(s) {
  s = String(s).toLowerCase();
  s = s.replace(/\([^)]*\)/g, " ");
  s = s.replace(/\+\s*(gen|dat|acc)\.?/g, " ");
  s = s.replace(/§[^,;]*/g, " ");
  s = s.replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
  return s.replace(/^(to|the|a|an) /, "").trim();
}
// Drop editorial asides so they can't masquerade as meanings: parenthetical notes
// ("sacrifice (the noun; listed under θῡ́ω)"), and bare cross-references to a parent
// lemma ("…; indented under πεῖρα") that H&Q writes without parentheses.
const stripParens = s => String(s)
  .replace(/\([^)]*\)/g, " ")
  .replace(/\b(?:listed|indented) under\b[^;,)]*/gi, " ");
// A gloss splits into its primary meanings on , and ; (H&Q's own separators).
const meaningList = gloss => [...new Set(stripParens(gloss).split(/[;,]/).map(normMeaning).filter(Boolean))];

// The same split, but kept READABLE for showing as a prompt: editorial asides, §refs and
// case markers removed, yet the original wording, case and punctuation preserved — so a
// prompt reads "how much? how many? how big?" and "it is to one's advantage", not the
// flattened matching key. A meaning is kept only if it has real content.
function displayMeanings(gloss) {
  return [...new Set(stripParens(gloss).split(/[;,]/)
    .map(s => s.replace(/§[^;,]*/g, " ").replace(/\+\s*(?:gen|dat|acc)\.?/gi, " ")
      .replace(/\s+/g, " ").trim().replace(/^[:–—-]\s*/, "").trim())
    .filter(s => normMeaning(s)))];
}

// What a typed English answer may be graded against: the primary meanings, plus the
// reading that keeps a parenthetical's contents inline — a parenthetical is sometimes an
// editorial note to drop ("sacrifice (listed under θῡ́ω)") and sometimes the subject
// ("(he/she/it) sends"), so accept both.
function acceptMeanings(gloss) {
  const out = new Set(meaningList(gloss));
  const inline = String(gloss).replace(/[()]/g, " ").replace(/\b(?:listed|indented) under\b[^;,]*/gi, " ");
  for (const chunk of inline.split(/[;,]/)) {
    const m = normMeaning(chunk);
    if (m) out.add(m);
  }
  return [...out];
}

// Equal, or within a single edit (one typo): insertion, deletion, or substitution.
function near(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  let i = 0;
  while (i < la && i < lb && a[i] === b[i]) i++;
  if (la === lb) return a.slice(i + 1) === b.slice(i + 1);
  return la < lb ? a.slice(i) === b.slice(i + 1) : a.slice(i + 1) === b.slice(i);
}

async function loadVocab() {
  const data = VOCAB_DATA
  for (const e of data.entries) {
    e.greek = nfc(e.greek); e.lemma = lemmaOf(e.greek);
    e.meanings = displayMeanings(e.gloss);                       // readable, for prompts
    e.meaningKeys = new Set(e.meanings.map(normMeaning));        // normalized, for matching
  }
  return data.entries;
}

// #/vocab asks what to test; #/vocab/<unit>/<only|through> starts straight away.
async function vocabView(unitArg, modeArg) {
  document.title = "Vocabulary quiz · Flashcards";
  const unit = Number(unitArg), mode = modeArg === "only" ? "only" : modeArg === "through" ? "through" : null;
  if (!vocabCache) {
    app().replaceChildren(h("div", { class: "empty" }, "Loading…"));
    try { vocabCache = await loadVocab(); }
    catch (e) { return app().replaceChildren(h("div", { class: "empty" }, "Couldn't load the quiz: " + e.message)); }
  }
  if (!unit || !mode) return vocabStart();
  return vocabRun({ unit, mode });
}

function vocabStart() {
  const maxUnit = vocabCache.reduce((m, e) => Math.max(m, e.unit), 1);
  const last = vocabStore.get("vocab-scope", { unit: Math.min(1, maxUnit), mode: "through" });
  if (!last.unit || last.unit > maxUnit) last.unit = maxUnit;
  const units = Array.from({ length: maxUnit }, (_, i) => i + 1);
  const count = (u, m) => vocabCache.filter(e => (m === "only" ? e.unit === u : e.unit <= u)).length;
  const pick = { unit: last.unit, mode: last.mode };
  const body = h("div", {});
  function draw() {
    const n = count(pick.unit, pick.mode);
    body.replaceChildren(
      h("h2", { style: { marginTop: "16px" } }, "1. Which unit are you on?"),
      h("div", { class: "drill-units" }, units.map(u => h("button", { class: "btn", "aria-pressed": String(pick.unit === u),
        onclick: () => { pick.unit = u; draw(); } }, String(u)))),
      h("h2", {}, "2. What should it cover?"),
      h("div", { class: "drill-scope" },
        h("button", { class: "choice", "aria-pressed": String(pick.mode === "only"), onclick: () => { pick.mode = "only"; draw(); } },
          h("span", {}, h("b", {}, `Unit ${pick.unit} only`), h("br"), h("small", { class: "muted" }, `Just the vocabulary introduced in Unit ${pick.unit}`))),
        h("button", { class: "choice", "aria-pressed": String(pick.mode === "through"), onclick: () => { pick.mode = "through"; draw(); } },
          h("span", {}, h("b", {}, `Everything through Unit ${pick.unit}`), h("br"), h("small", { class: "muted" }, `All vocabulary from Units 1–${pick.unit}`)))),
      h("p", { class: "muted", style: { fontSize: "14px" } }, n ? `${n} word${n === 1 ? "" : "s"} to draw from.` : "No words for this choice yet."),
      h("button", { class: "btn primary", disabled: !n, onclick: () => {
        vocabStore.set("vocab-scope", pick);
        location.hash = `#/vocab/${pick.unit}/${pick.mode}`;
      } }, "Start quiz →"));
  }
  draw();
  app().replaceChildren(
    h("div", { class: "row" }, h("a", { href: "#/", class: "muted" }, "← Home")),
    h("h1", { style: { marginTop: "8px" } }, "Vocabulary quiz"),
    h("p", { class: "muted", style: { marginTop: 0, fontSize: "14px" } },
      "Endless questions on every H&Q vocabulary word — nouns, verbs, adjectives, prepositions and the little words ",
      "(conjunctions, particles, adverbs) — across whatever units you choose. Every headword is copied straight from H&Q's printed vocabulary pages."),
    body);
}

function vocabRun(scope) {
  document.title = `Unit ${scope.unit}${scope.mode === "only" ? " only" : ""} · Vocabulary quiz`;
  const settings = vocabStore.get("vocab-settings", { cats: VOCAB_CATS.map(c => c[0]), types: VOCAB_TYPES.map(t => t[0]), grading: "strict" });
  settings.types = settings.types.filter(t => VOCAB_TYPES.some(d => d[0] === t));
  if (!settings.types.length) settings.types = VOCAB_TYPES.map(t => t[0]);
  settings.cats = settings.cats.filter(c => VOCAB_CATS.some(d => d[0] === c));
  if (!settings.cats.length) settings.cats = VOCAB_CATS.map(c => c[0]);
  const stats = vocabStore.get("vocab-stats", {});
  const st = { recent: [], answered: 0, right: 0, streak: 0, cur: null };
  const saveSettings = () => vocabStore.set("vocab-settings", settings);

  const score = h("div", { class: "tally" });
  const stage = h("div", {});
  const settingsBox = h("details", { class: "panel drill-settings" });
  const drawScore = () => score.replaceChildren(
    h("span", {}, `${st.right} / ${st.answered} right`),
    h("span", {}, st.streak > 1 ? `streak ${st.streak}` : ""));

  app().replaceChildren(
    h("div", { class: "row" }, h("a", { href: "#/", class: "muted" }, "← Home")),
    h("div", { class: "row", style: { marginTop: "8px" } },
      h("h1", { style: { flex: "1" } }, scope.mode === "only" ? `New in Unit ${scope.unit}` : `Units 1–${scope.unit}`),
      h("a", { class: "btn small", href: "#/vocab" }, "Change unit")),
    settingsBox, score, stage);

  // Everything through the chosen unit — the universe for synonyms and distractors.
  const throughUnit = vocabCache.filter(e => e.unit <= scope.unit);
  // The quiz pool: the chosen scope, narrowed to the switched-on categories.
  const pool = () => throughUnit.filter(e => (scope.mode === "only" ? e.unit === scope.unit : true) && settings.cats.includes(e.cat));
  // Every in-scope entry that lists this meaning (ἵνα / ὅπως / ὡς all share "in order that").
  const sharers = meaning => { const k = normMeaning(meaning); return throughUnit.filter(e => e.meaningKeys.has(k)); };

  function drawSettings() {
    const toggle = (list, key) => {
      const on = list.includes(key);
      return h("button", { class: "btn small", "aria-pressed": String(on), onclick: () => {
        const i = list.indexOf(key);
        if (i >= 0) { if (list.length > 1) list.splice(i, 1); } else list.push(key);
        saveSettings(); drawSettings(); next();
      } });
    };
    const open = settingsBox.open;
    settingsBox.replaceChildren(
      h("summary", {}, "Settings"),
      h("div", { class: "options", style: { marginTop: "12px" } },
        h("b", {}, "Categories"),
        h("div", { class: "row" }, VOCAB_CATS.map(([k, label]) => append(toggle(settings.cats, k), [label]))),
        h("b", {}, "Question types"),
        h("div", { class: "row" }, VOCAB_TYPES.map(([k, label]) => append(toggle(settings.types, k), [label]))),
        h("div", { class: "muted", style: { fontSize: "13px" } }, VOCAB_TYPES.map(t => h("div", {}, h("b", {}, t[1]), ": ", t[2]))),
        h("b", {}, "Typed Greek"),
        h("div", { class: "row" },
          ["strict", "lenient"].map(g => h("button", { class: "btn small", "aria-pressed": String(settings.grading === g),
            onclick: () => { settings.grading = g; saveSettings(); drawSettings(); } }, g === "strict" ? "Accents count" : "Ignore accents"))),
        h("div", { class: "muted", style: { fontSize: "13px" } }, "Vowel length (macrons) is never required; breathings and accents count unless you turn them off."),
        h("div", { class: "row" },
          h("button", { class: "btn small ghost", onclick: () => confirmModal("Reset quiz history?",
            "Forget which words you've missed, so every word is weighted equally again.", "Reset",
            () => { for (const k of Object.keys(stats)) delete stats[k]; vocabStore.set("vocab-stats", stats); toast("History reset"); }) }, "Reset history"))));
    settingsBox.open = open;
  }

  function weight(e) {
    const s = stats[e.id];
    if (!s) return 2;
    return (s.missed ? 4 : 0) + 1 / (1 + s.streak);
  }
  function choose(items) {
    const fresh = items.filter(e => !st.recent.includes(e.id));
    const cand = fresh.length ? fresh : items;
    let r = Math.random() * cand.reduce((a, e) => a + weight(e), 0);
    for (const e of cand) { r -= weight(e); if (r <= 0) return e; }
    return cand[cand.length - 1];
  }
  function record(e, ok) {
    const s = stats[e.id] || (stats[e.id] = { seen: 0, right: 0, streak: 0, missed: false });
    s.seen++; if (ok) { s.right++; s.streak++; if (s.streak >= 2) s.missed = false; } else { s.streak = 0; s.missed = true; }
    vocabStore.set("vocab-stats", stats);
    st.answered++; if (ok) { st.right++; st.streak++; } else st.streak = 0;
    drawScore();
  }

  function next() {
    state.onKey = null;
    const items = pool();
    if (!items.length) {
      stage.replaceChildren(h("div", { class: "empty" }, "No words in this unit for the chosen categories. Pick another unit or turn on a category in Settings."));
      return;
    }
    const e = choose(items);
    st.recent = [e.id, ...st.recent].slice(0, Math.min(8, Math.floor(items.length / 2)));
    st.cur = e;
    const t = pick1(settings.types);
    return ({ g2e: askMeaning, pick: askPick, type: askType }[t] || askMeaning)(e);
  }

  // ---- shared pieces
  const frame = (label, prompt, body) => stage.replaceChildren(h("div", { class: "qcard" },
    h("div", { class: "qlabel" }, label, h("span", { class: "muted" }, `Unit ${st.cur.unit} · ${CAT_LABEL[st.cur.cat]}`)),
    h("div", { class: "prompt" }, prompt), body));
  const nextBtn = () => {
    const b = h("button", { class: "btn primary", onclick: next }, "Next →");
    state.onKey = ev => { if (ev.key === "Enter" && !(ev.target instanceof HTMLButtonElement)) { ev.preventDefault(); next(); } };
    setTimeout(() => b.focus(), 0);
    return h("div", { class: "row", style: { marginTop: "14px" } }, b);
  };
  // A short, clean section name: drop wiki-links and any trailing parenthetical aside.
  const sectionLabel = s => String(s).replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, "$1").replace(/\s*\(.*$/, "").trim() || "Vocabulary";
  // The translation, shown cleanly. For a preposition the gloss bundles its case(s)
  // ("+ gen. instead of, in place of"); split those out so the English reads on its own.
  function glossBlock(e) {
    if (e.cat === "preposition") {
      const rows = [], re = /\+\s*(gen|dat|acc)\.\s*([^+]*)/g;
      let m;
      while ((m = re.exec(e.gloss))) {
        const mean = m[2].replace(/^[;,\s]+|[;,\s]+$/g, "");
        if (mean) rows.push(h("div", { style: { marginTop: rows.length ? "3px" : 0 } },
          h("span", { class: "muted", style: { fontSize: "13px" } }, "+ " + m[1] + ". "), "“" + mean + "”"));
      }
      if (rows.length) return h("div", {}, rows);
    }
    return h("div", {}, "“" + e.gloss + "”");
  }
  // What we reveal after any answer: the full headword, its translation, and its sources.
  function entryAnswer(e, alsoMeaning) {
    const extra = alsoMeaning ? sharers(alsoMeaning).filter(o => o.id !== e.id) : [];
    return h("div", {},
      h("div", { class: "drill-parse" },
        h("div", { class: "ans", lang: "grc" }, e.greek),
        e.kind ? h("div", { class: "muted", style: { fontSize: "13px" } }, e.kind) : null,
        glossBlock(e),
        h("div", { class: "muted", style: { fontSize: "13px" } }, `H&Q Unit ${e.unit} vocabulary · ${sectionLabel(e.section)}`)),
      extra.length ? h("div", { class: "muted", style: { fontSize: "13px" } },
        "Also accepted (same meaning): ", extra.map((o, i) => [i ? ", " : "", h("span", { lang: "grc" }, o.lemma)]).flat()) : null);
  }

  // ---- Greek → English (type the meaning)
  function askMeaning(e) {
    const fb = h("div", {});
    let done = false;
    const inp = h("input", { class: "field", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
      placeholder: "Type the meaning", "aria-label": "English meaning" });
    const check = () => {
      if (done || !inp.value.trim()) return;
      done = true; inp.disabled = true;
      const g = normMeaning(inp.value);
      const ok = !!g && acceptMeanings(e.gloss).some(m => near(g, m));
      record(e, ok);
      fb.replaceChildren(h("div", { class: "feedback " + (ok ? "good" : "bad") },
        ok ? "Correct!" : "Not quite.",
        h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, entryAnswer(e))), nextBtn());
    };
    state.onKey = ev => { if (ev.key === "Enter" && !done) { ev.preventDefault(); check(); } };
    frame("Greek → English", h("div", { class: "card-text greek size-xl", lang: "grc" }, e.greek),
      h("div", {}, inp,
        h("div", { class: "muted", style: { fontSize: "13px", marginTop: "6px" } }, "Any one of its meanings counts; a single typo is forgiven."),
        h("div", { class: "row", style: { marginTop: "12px" } }, h("button", { class: "btn primary", onclick: check }, "Check")), fb));
    setTimeout(() => inp.focus(), 0);
  }

  // A meaning to prompt an English → Greek question, and everyone who answers it.
  // Prefer a short, translation-like meaning over a long usage note (some particles only
  // have descriptive glosses — those fall back to whatever is there).
  function promptMeaning(e) {
    const ms = e.meanings;
    const short = ms.filter(x => x.split(/\s+/).length <= 4);
    const m = short.length ? pick1(short) : ms.length ? pick1(ms) : null;
    return { meaning: m, right: m ? sharers(m) : [e] };
  }

  // ---- English → Greek (pick from four)
  function askPick(e) {
    const { meaning, right } = promptMeaning(e);
    if (!meaning) return askMeaning(e);                 // no usable meaning → fall back
    const rightLemmas = new Set(right.map(o => o.lemma));
    const distractPool = throughUnit.filter(o => !rightLemmas.has(o.lemma));
    const sameCat = shuffle(distractPool.filter(o => o.cat === e.cat));
    const ds = [], seen = new Set(rightLemmas);
    for (const src of [sameCat, shuffle(distractPool)]) {
      for (const o of src) { if (seen.has(o.lemma)) continue; seen.add(o.lemma); ds.push(o.lemma); if (ds.length >= 3) break; }
      if (ds.length >= 3) break;
    }
    const options = shuffle([e.lemma, ...ds]);
    const fb = h("div", {});
    let done = false;
    const buttons = options.map((o, i) => h("button", { class: "choice", onclick: () => pickOne(i) },
      h("span", { class: "num" }, i + 1), h("span", { lang: "grc" }, o)));
    function pickOne(i) {
      if (done) return;
      done = true;
      const ok = rightLemmas.has(options[i]);
      const correctIdx = options.findIndex(o => rightLemmas.has(o));
      buttons[correctIdx].classList.add("right");
      if (!ok) buttons[i].classList.add("wrong");
      record(e, ok);
      fb.replaceChildren(h("div", { class: "feedback " + (ok ? "good" : "bad") }, ok ? "Correct!" : "Not quite.",
        h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, entryAnswer(e, meaning))), nextBtn());
    }
    state.onKey = ev => { const n = Number(ev.key); if (!done && n >= 1 && n <= options.length) pickOne(n - 1); };
    frame("English → Greek", h("div", {}, h("div", { class: "size-l" }, "“" + meaning + "”"),
      h("div", { class: "size-m muted" }, "Which Greek word means this?")),
      h("div", {}, h("div", { class: "choices" }, buttons), fb));
  }

  // ---- English → Greek (type the Greek)
  function askType(e) {
    const { meaning, right } = promptMeaning(e);
    if (!meaning) return askMeaning(e);
    const forms = [...new Set(right.flatMap(o => [o.lemma, o.greek]))];
    const fb = h("div", {});
    let done = false;
    const inp = h("input", { class: "field", "data-greek": "", lang: "grc", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
      placeholder: "Type the Greek word", "aria-label": "Greek word" });
    const check = () => {
      if (done || !inp.value.trim()) return;
      done = true; inp.disabled = true;
      // Macrons/breves are shown in the answer but never required.
      const results = forms.map(f => grade(noLength(inp.value), noLength(f), settings.grading));
      const res = results.includes("right") ? "right" : results.includes("close") ? "close" : "wrong";
      record(e, res === "right");
      fb.replaceChildren(h("div", { class: "feedback " + (res === "right" ? "good" : res === "close" ? "close" : "bad") },
        res === "right" ? "Correct!" : res === "close" ? "Close: check the accents and breathings." : "Not quite.",
        h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, entryAnswer(e, meaning))), nextBtn());
    };
    state.onKey = ev => { if (ev.key === "Enter" && !done) { ev.preventDefault(); check(); } };
    frame("English → Greek", h("div", {}, h("div", { class: "size-l" }, "“" + meaning + "”"),
      h("div", { class: "size-m muted" }, "Write the Greek word (just the headword — the lemma).")),
      h("div", {}, inp,
        h("div", { class: "muted", style: { fontSize: "13px", marginTop: "6px" } }, "Type the dictionary form; vowel length isn't required."),
        h("div", { class: "row", style: { marginTop: "12px" } }, h("button", { class: "btn primary", onclick: check }, "Check")), fb));
    setTimeout(() => inp.focus(), 0);
  }

  drawSettings(); drawScore(); next();
}


// ---- home + router: the artifact bundles the verb drill and the vocabulary quiz.
function homeView() {
  document.title = "H&Q Greek";
  app().replaceChildren(
    h("h1", {}, "H&Q Greek"),
    h("p", { class: "muted", style: { marginTop: "4px", fontSize: "14px" } },
      "Study tools for Hansen & Quinn, offline. Pick a quiz; each one asks which unit you're on."),
    h("a", { class: "panel deck-tile drill-tile", href: "#/drill", style: { marginTop: "18px" } },
      h("h3", {}, "Verb drill"),
      h("div", { class: "muted" }, "Parse, find and write verb forms — tense, mood, person, number, by unit")),
    h("a", { class: "panel deck-tile tables-tile", href: "#/tables", style: { marginTop: "12px" } },
      h("h3", {}, "Ending tables"),
      h("div", { class: "muted" }, "Fill in the personal endings — person × number, each tense & mood, by unit")),
    h("a", { class: "panel deck-tile noun-tile", href: "#/ndrill", style: { marginTop: "12px" } },
      h("h3", {}, "Noun drill"),
      h("div", { class: "muted" }, "Decline every noun — case and number, by unit (built by rule)")),
    h("a", { class: "panel deck-tile vocab-tile", href: "#/vocab", style: { marginTop: "12px" } },
      h("h3", {}, "Vocabulary quiz"),
      h("div", { class: "muted" }, "Every H&Q word — Greek ↔ English, by unit and category")));
}
function route() {
  state.onKey = null;
  state.cleanup && state.cleanup(); state.cleanup = null;
  const bar = $("#accent-bar"); if (bar) bar.hidden = true;
  const [view, id, mode] = location.hash.replace(/^#\/?/, "").split("/");
  window.scrollTo(0, 0);
  if (view === "drill") return drillView(id, mode);
  if (view === "tables") return tableDrillView(id, mode);
  if (view === "ndrill") return nounDrillView(id, mode);
  if (view === "vocab") return vocabView(id, mode);
  return homeView();
}
window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", () => { setupAccentBar(); route(); });

</script>
