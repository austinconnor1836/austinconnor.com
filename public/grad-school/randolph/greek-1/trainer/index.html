<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>H&amp;Q Greek</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='22' height='16' rx='3' fill='%23c9d6cf'/%3E%3Crect x='7' y='10' width='22' height='16' rx='3' fill='%232f5d50'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f3ee;
  --surface: #ffffff;
  --surface-2: #eef1ee;
  --ink: #1f2522;
  --muted: #66706b;
  --line: #d9ddd8;
  --accent: #2f5d50;
  --accent-ink: #ffffff;
  --accent-soft: #dfeae5;
  --good: #23784a;
  --good-soft: #def2e5;
  --bad: #b2402f;
  --bad-soft: #f8e2dd;
  --warn: #9a6a00;
  --warn-soft: #fbf0d4;
  --star: #c99400;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --greek: "New Athena Unicode", "GFS Didot", "Gentium Plus", "Noto Serif", "Times New Roman", serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151917; --surface: #1f2522; --surface-2: #29302c; --ink: #e8ece9;
    --muted: #9aa49f; --line: #39413d; --accent: #7fb8a4; --accent-ink: #10201a;
    --accent-soft: #2a3c35; --good: #6fcf97; --good-soft: #1f3a2a; --bad: #ef8a78;
    --bad-soft: #432520; --warn: #e0b54a; --warn-soft: #3d331a; --star: #e8c04a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--ui);
  -webkit-text-size-adjust: 100%; min-height: 100vh;
}
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
.greek, .card-text, .cell, .chip, .tile, textarea.field, input.field { font-family: var(--greek); }

.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-left)); background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; text-decoration: none; color: var(--ink); font-size: 18px; }
.save-status { margin-left: auto; color: var(--muted); font-size: 13px; }

main { max-width: 960px; margin: 0 auto; padding: 20px 16px 120px; }
h1 { font-size: 26px; margin: 0 0 4px; line-height: 1.2; }
h2 { font-size: 19px; margin: 28px 0 10px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; text-decoration: none; color: var(--ink);
  font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { min-height: 36px; padding: 0 10px; font-size: 14px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { min-width: 44px; padding: 0; }

.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow);
}
.deck-tile { display: block; text-decoration: none; color: inherit; }
.deck-tile:hover { border-color: var(--accent); }
.deck-tile h3 { margin: 0 0 4px; font-size: 17px; overflow-wrap: anywhere; }

.modes { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); margin: 18px 0; }
@media (max-width: 640px) { .modes { grid-template-columns: repeat(2, 1fr); } }
.mode {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px;
  min-height: 72px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
  text-decoration: none; color: var(--ink); font-weight: 650; box-shadow: var(--shadow);
}
.mode small { font-weight: 400; color: var(--muted); }
.mode:hover { border-color: var(--accent); }

.progress { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.progress > span { display: block; height: 100%; }
.progress .p-good { background: var(--good); }
.progress .p-warn { background: var(--warn); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

.term-list { display: grid; gap: 8px; }
.term-row {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 14px;
  align-items: start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px;
}
.term-row .card-text { white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 640px) { .term-row { grid-template-columns: minmax(0, 1fr) auto; } .term-row > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; } }
.star { color: var(--muted); font-size: 22px; line-height: 1; }
.star[aria-pressed="true"] { color: var(--star); }

/* ---------- paradigm tables ---------- */
.ptable-wrap { overflow-x: auto; max-width: 100%; }
table.ptable { border-collapse: collapse; margin: 0 auto; font-size: inherit; }
.ptable th, .ptable td { border: 2px solid var(--ink); padding: .35em .7em; text-align: center; vertical-align: middle; }
.ptable th { background: var(--surface-2); font-family: var(--ui); font-weight: 700; font-size: .62em; }
.ptable td { font-family: var(--greek); min-width: 4.5em; }
.ptable td.ok { background: var(--good-soft); }
.ptable td.bad { background: var(--bad-soft); }
.ptable td.close { background: var(--warn-soft); }
.ptable .fix { display: block; font-size: .75em; color: var(--good); }
.ptable td input {
  width: 100%; min-width: 5em; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  background: var(--surface); font-family: var(--greek); font-size: 1em; text-align: center; min-height: 44px;
}
.slot {
  display: inline-flex; min-width: 4.5em; min-height: 44px; align-items: center; justify-content: center;
  border: 2px dashed var(--line); border-radius: 8px; padding: 0 8px; cursor: pointer; background: transparent;
  font-family: var(--greek); font-size: 1em;
}
.slot.filled { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.slot.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.chip {
  min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 22px; box-shadow: var(--shadow);
}
.chip:disabled { visibility: hidden; }

/* ---------- flashcards ---------- */
.study-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.study-head h1 { font-size: 20px; }
.flip-scene { perspective: 1600px; margin: 0 auto; max-width: 820px; touch-action: pan-y; }
.flip-card {
  position: relative; width: 100%; min-height: min(62vh, 480px); cursor: pointer;
  transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1);
}
.flip-card.flipped { transform: rotateY(180deg); }
.flip-card.noanim { transition: none; }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); overflow: auto; text-align: center;
}
.face.back { transform: rotateY(180deg); }
.face .side-label { position: absolute; top: 12px; left: 16px; font-size: 13px; color: var(--muted); }
.face .face-star { position: absolute; top: 4px; right: 6px; }
.card-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.size-xl { font-size: clamp(30px, 6vw, 46px); }
.size-l { font-size: clamp(24px, 4.5vw, 34px); }
.size-m { font-size: clamp(19px, 3.4vw, 25px); }
.size-s { font-size: 17px; }
.face img, .prompt img, .tile img, .term-row img { max-width: 100%; max-height: 260px; border-radius: 8px; }
.face .ptable { font-size: clamp(20px, 4vw, 32px); }
.nav-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; }
.counter { min-width: 80px; text-align: center; font-weight: 600; }
.sort-btn.learning { color: var(--warn); border-color: var(--warn); }
.sort-btn.know { color: var(--good); border-color: var(--good); }
.tally { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
.tally .l { color: var(--warn); } .tally .k { color: var(--good); }
.kbd-hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; }
@media (hover: none) { .kbd-hint { display: none; } }

/* ---------- learn / test ---------- */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.qlabel { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; display: flex; gap: 10px; }
.prompt { margin: 6px 0 22px; }
.prompt .ptable { font-size: clamp(19px, 3.6vw, 28px); }
.choices { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 640px) { .choices { grid-template-columns: 1fr; } }
.choice {
  text-align: left; min-height: 56px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--surface); cursor: pointer; font-family: var(--greek); font-size: 19px; display: flex; gap: 12px; align-items: center;
}
.choice .num { font-family: var(--ui); font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 50%; min-width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
.choice:hover { border-color: var(--accent); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
input.field, textarea.field, select.field {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface);
  font-size: 19px; min-height: 48px;
}
textarea.field { resize: vertical; min-height: 64px; }
select.field { font-family: var(--ui); font-size: 16px; }
input.field:focus, textarea.field:focus, .ptable td input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.feedback { margin-top: 16px; padding: 14px; border-radius: 12px; }
.feedback.good { background: var(--good-soft); color: var(--good); font-weight: 650; }
.feedback.bad { background: var(--bad-soft); }
.feedback.close { background: var(--warn-soft); }
.feedback .lbl { font-size: 13px; font-weight: 650; color: var(--muted); margin-top: 6px; }
.feedback .ans { font-family: var(--greek); font-size: 20px; white-space: pre-wrap; }
.round-bar { display: flex; gap: 4px; margin-bottom: 14px; }
.round-bar span { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
.round-bar span.done { background: var(--good); }
.round-bar span.miss { background: var(--warn); }
.done-box { text-align: center; padding: 30px 16px; }
.done-box .big { font-size: 44px; font-weight: 750; }
.options { display: grid; gap: 12px; }
.options label { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.options input[type=checkbox], .options input[type=radio] { width: 20px; height: 20px; }
.test-q { margin-bottom: 16px; }
.test-q.right { border-color: var(--good); }
.test-q.wrong { border-color: var(--bad); }
.tf { display: flex; gap: 10px; }
.tf .choice { flex: 1; justify-content: center; font-family: var(--ui); }

/* ---------- match ---------- */
.match-board { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }
@media (max-width: 640px) { .match-board { grid-template-columns: repeat(3, 1fr); } }
.tile {
  min-height: 110px; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface);
  cursor: pointer; font-size: 19px; overflow-wrap: anywhere; box-shadow: var(--shadow); transition: opacity .25s, transform .25s;
}
.tile.sel { border-color: var(--accent); background: var(--accent-soft); }
.tile.err { border-color: var(--bad); background: var(--bad-soft); }
.tile.gone { opacity: 0; transform: scale(.85); pointer-events: none; }
.tile .lab { font-family: var(--ui); font-size: 15px; }
.timer { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }

/* ---------- editor ---------- */
.edit-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.edit-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--muted); font-size: 14px; font-weight: 650; }
.edit-two { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 640px) { .edit-two { grid-template-columns: 1fr; } }
.fieldlab { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; margin: 4px 0; display: flex; gap: 6px; align-items: center; }
.thumb { position: relative; display: inline-block; margin-top: 6px; }
.thumb img { max-height: 120px; max-width: 100%; border-radius: 6px; display: block; }
.etable td, .etable th { padding: 4px; }
.etable input { width: 100%; min-width: 6em; min-height: 40px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--surface); text-align: center; }
.etable th input { font-family: var(--ui); font-weight: 700; font-size: 14px; background: var(--surface-2); }
.etable td input { font-family: var(--greek); font-size: 18px; }

/* ---------- accent bar ---------- */
.accent-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; gap: 6px; justify-content: center;
  flex-wrap: wrap; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--surface);
  border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08);
}
.accent-bar[hidden] { display: none; }
.accent-bar button {
  min-width: 44px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2);
  cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.accent-bar button b { font-family: var(--greek); font-size: 24px; font-weight: 400; }
.accent-bar button small { font-size: 9px; color: var(--muted); margin-top: 2px; }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow: auto; }
.modal { background: var(--surface); border-radius: 16px; padding: 20px; width: min(640px, 100%); box-shadow: var(--shadow); }
.modal h2 { margin-top: 0; }
.modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; }

/* ---------- verb drill ---------- */
.drill-tile { border-left: 4px solid var(--accent); }
.tables-tile { border-left: 4px solid var(--ink); }
.formation { margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 8px; font-size: 14px; line-height: 1.5; }
.formation b { color: var(--accent); }
.noun-tile { border-left: 4px solid var(--good, #4a9d6b); }
.vocab-tile { border-left: 4px solid var(--warn, #c08a2d); }
.drill-settings { margin: 12px 0 16px; }
.drill-settings summary { cursor: pointer; font-weight: 650; min-height: 32px; display: flex; align-items: center; }
.drill-groups { display: grid; gap: 12px; }
.drill-group .lbl { font-size: 13px; font-weight: 650; color: var(--muted); margin-bottom: 4px; }
.drill-group .btn.small { min-height: 44px; }
.drill-settings .btn.small { min-height: 44px; white-space: normal; text-align: left; }
.drill-parse { padding: 8px 0; border-top: 1px solid var(--line); }
.drill-parse:first-child { border-top: 0; }
.choice.drill-eng { font-family: var(--ui); font-size: 16px; }
.drill-own-list { display: grid; gap: 10px; max-height: 55vh; overflow-y: auto; }
.drill-own label { display: flex; gap: 8px; align-items: center; min-height: 44px; flex-wrap: wrap; }
.drill-own-fields { display: grid; gap: 8px; grid-template-columns: 2fr 1fr 1fr; margin-top: 6px; }
@media (max-width: 640px) { .drill-own-fields { grid-template-columns: 1fr; } }
.drill-units { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); }
.drill-scope { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-bottom: 8px; }
@media (max-width: 640px) { .drill-scope { grid-template-columns: 1fr; } }
.drill-scope .choice { font-family: var(--ui); font-size: 16px; }
.drill-scope .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.built-badge { margin-left: auto; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 0 8px; font-weight: 650; }


/* Artifact theme toggle: data-theme must win over the OS media query, both ways. */
:root[data-theme="dark"] {
  --bg: #151917; --surface: #1f2522; --surface-2: #29302c; --ink: #e8ece9;
  --muted: #9aa49f; --line: #39413d; --accent: #7fb8a4; --accent-ink: #10201a;
  --accent-soft: #2a3c35; --good: #6fcf97; --good-soft: #1f3a2a; --bad: #ef8a78;
  --bad-soft: #432520; --warn: #e0b54a; --warn-soft: #3d331a; --star: #e8c04a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark;
}
.vocab-tile { border-left: 4px solid var(--warn); }

</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">H&amp;Q Greek</a>
</header>
<main id="app"></main>
<div id="accent-bar" class="accent-bar" hidden></div>
<div id="modal-root"></div>

<script>

"use strict";
const $ = (sel, el = document) => el.querySelector(sel);
const PROPS = new Set(["value", "checked", "disabled", "selected", "hidden", "multiple"]);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (PROPS.has(k)) el[k] = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  append(el, kids);
  return el;
}
function append(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
const nativeReplace = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) { nativeReplace.call(this); return append(this, kids); };
const nfc = s => (s || "").normalize("NFC");
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function toast(msg) {
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}
const state = { onKey: null, cleanup: null };
const app = () => $("#app");
document.addEventListener("keydown", e => {
  if ($("#modal-root").childElementCount) return;
  state.onKey && state.onKey(e);
});

// ---- offline stubs: the artifact has no deck backend, so the drill's "own paradigms"
// path finds nothing and these are never called with real data.
const api = { list: async () => [], get: async () => ({ cards: [] }), save: async () => ({}), del: async () => ({}) };
async function j(r) { return r.json(); }
const isTable = () => false;
const normalizeDeck = d => d || { cards: [] };

// ---- grading (app.js)
const APOS = /[’ʼ᾽᾿']/g;
function baseNorm(s) {
  return nfc(s).replace(APOS, "'").replace(/\s+/g, " ").trim().toLocaleLowerCase();
}
function loose(s) {
  return baseNorm(s).normalize("NFD").replace(/\p{M}/gu, "").replace(/ς/g, "σ")
    .replace(/[.,;:!?·;"“”()\[\]]/g, "").replace(/\s+/g, " ").trim().normalize("NFC");

const OPTIONAL = /(?<=\S)\(([^()\s]+)\)/g;

/* Verb drill: an endless quiz on the verb forms in drill-pool.json (H&Q's
   printed paradigms, page cited) plus any table cards you tag yourself.
   It only shows and grades forms it was given. It never builds a Greek form. */
"use strict";

const DRILL_CATS = [
  ["pres", "Present indicative active"], ["impf", "Imperfect indicative active"],
  ["fut", "Future indicative active"], ["aor", "Aorist indicative active"],
  ["subj", "Subjunctive active"], ["opt", "Optative active"],
  ["perf", "Perfect indicative active"], ["inf", "Infinitive active"],
];
const DRILL_TYPES = [
  ["parse", "Parse & translate", "See a form → name its tense, mood, person, number, and type its English"],
  ["pick", "Find it", "See a description → pick the Greek form"],
  ["build", "Write it", "See a description → type the Greek form"],
];
const TENSES = ["present", "imperfect", "future", "aorist", "perfect"];
const MOODS = ["indicative", "subjunctive", "optative", "infinitive"];
const PERSONS = ["1st", "2nd", "3rd"];
const NUMBERS = ["singular", "plural"];
const SLOT = [[1, "singular"], [2, "singular"], [3, "singular"], [1, "plural"], [2, "plural"], [3, "plural"]];

const drillStore = {
  get(key, dflt) { try { return Object.assign(dflt, JSON.parse(localStorage.getItem(key) || "{}")); } catch { return dflt; } },
  set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch { /* private mode */ } },
};
let drillPoolCache = null;

function catOf(it) {
  if (it.mood === "infinitive") return "inf";
  if (it.mood === "subjunctive") return "subj";
  if (it.mood === "optative") return "opt";
  return { present: "pres", imperfect: "impf", future: "fut", aorist: "aor", perfect: "perf" }[it.tense];
}
const ordinal = p => PERSONS[p - 1];
function describe(it) {
  return it.mood === "infinitive"
    ? `${it.tense} infinitive active`
    : `${ordinal(it.person)} ${it.number} · ${it.tense} ${it.mood} active`;
}
const noLength = s => nfc(String(s).normalize("NFD").replace(/[\u0304\u0306]/g, ""));
const isClause = it => it.mood === "subjunctive" || it.mood === "optative";
const sameParse = (a, b) => a.tense === b.tense && a.mood === b.mood && a.person === b.person && a.number === b.number;
const pick1 = a => a[Math.floor(Math.random() * a.length)];
// Split "a / b" into H&Q-style alternatives; keep the user's text otherwise untouched.
const altsOf = s => (Array.isArray(s) ? s : String(s).split(/\s+\/\s+|\s*\/\s*(?=\S)/)).map(x => nfc(x.trim())).filter(Boolean);

async function loadDrillPool() {
  const items = [];
  const book = DRILL_POOL;
  const built = DRILL_BUILT;
  const bookAlso = built.alsoEnglish || {}, bookEng = built.bookEnglish || {};
  for (const v of book.verbs) for (const p of v.paradigms) {
    // παιδεύω is Unit 2 vocabulary; each paradigm belongs to the unit that teaches it.
    const base = { lemma: nfc(v.lemma), tense: p.tense, mood: p.mood, page: p.page, section: p.section,
      vocabUnit: 2, tenseUnit: p.unit, src: "book" };
    if (p.mood === "infinitive") {
      items.push({ ...base, id: `b:${v.lemma}:${p.tense}:inf`, person: null, number: null, forms: altsOf(p.forms[0]), english: p.english?.[0] || null,
        also: bookAlso[v.lemma]?.[`${p.tense}:${p.mood}`]?.[0] || null });
      continue;
    }
    p.forms.forEach((f, i) => items.push({ ...base, id: `b:${v.lemma}:${p.tense}:${p.mood}:${i}`,
      person: SLOT[i][0], number: SLOT[i][1], forms: altsOf(f), english: p.english?.[i] || bookEng[v.lemma]?.[`${p.tense}:${p.mood}`]?.[i] || null,
      also: bookAlso[v.lemma]?.[`${p.tense}:${p.mood}`]?.[i] || null }));
  }
  // Forms BUILT BY RULE from H&Q vocabulary principal parts (build_vocab_drill.py).
  for (const v of built.verbs) for (const p of v.paradigms) {
    const base = { lemma: nfc(v.lemma), tense: p.tense, mood: p.mood, section: p.section, vocabUnit: v.unit, tenseUnit: p.tenseUnit, src: "built" };
    if (p.mood === "infinitive") {
      items.push({ ...base, id: `g:${v.lemma}:${p.tense}:inf`, person: null, number: null, forms: p.forms[0].map(nfc), english: p.english?.[0] || null, also: p.alsoEnglish?.[0] || null });
      continue;
    }
    p.forms.forEach((f, i) => items.push({ ...base, id: `g:${v.lemma}:${p.tense}:${p.mood}:${i}`,
      person: SLOT[i][0], number: SLOT[i][1], forms: f.map(nfc), english: p.english?.[i] || null, also: p.alsoEnglish?.[i] || null }));
  }
  // Your own table cards, tagged from the "Your paradigms" panel.
  const own = [];
  for (const meta of await api.list()) {
    const deck = normalizeDeck(await api.get(meta.id));
    for (const c of deck.cards) {
      if (!isTable(c) || !c.drill || c.rows.length !== 3 || c.cols.length !== 2) continue;
      const lemma = nfc(c.drill.lemma || c.title || "");
      for (let r = 0; r < 3; r++) for (let k = 0; k < 2; k++) {
        const forms = altsOf(c.cells[r][k] || "");
        if (!forms.length) continue;
        own.push({ id: `u:${deck.id}:${c.id}:${r}${k}`, lemma, tense: c.drill.tense, mood: c.drill.mood,
          person: r + 1, number: NUMBERS[k], forms, english: null, src: "own", deckName: deck.name, cardTitle: c.title });
      }
    }
  }
  return { book: items, own };
}

// #/drill asks what to test; #/drill/<unit>/<only|through> starts straight away.
async function drillView(unitArg, modeArg) {
  document.title = "Verb drill · Flashcards";
  const unit = Number(unitArg), mode = modeArg === "only" ? "only" : modeArg === "through" ? "through" : null;
  if (!drillPoolCache) {
    app().replaceChildren(h("div", { class: "empty" }, "Loading…"));
    try { drillPoolCache = await loadDrillPool(); }
    catch (e) { return app().replaceChildren(h("div", { class: "empty" }, "Couldn't load the drill: " + e.message)); }
  }
  if (!unit || !mode) return drillStart();
  return drillRun({ unit, mode });
}

function drillStart() {
  const last = drillStore.get("drill-scope", { unit: 2, mode: "through" });
  const count = (u, m) => drillPoolCache.book.filter(it => it.src !== "own" && it.vocabUnit <= u && (m === "only" ? it.tenseUnit === u : it.tenseUnit <= u)).length;
  const units = Array.from({ length: 19 }, (_, i) => i + 2);
  const pick = { unit: last.unit, mode: last.mode };
  const body = h("div", {});
  function draw() {
    const n = count(pick.unit, pick.mode);
    body.replaceChildren(
      h("h2", { style: { marginTop: "16px" } }, "1. Which unit are you on?"),
      h("div", { class: "drill-units" }, units.map(u => h("button", { class: "btn", "aria-pressed": String(pick.unit === u),
        onclick: () => { pick.unit = u; draw(); } }, String(u)))),
      h("h2", {}, "2. What should it cover?"),
      h("div", { class: "drill-scope" },
        h("button", { class: "choice", "aria-pressed": String(pick.mode === "only"), onclick: () => { pick.mode = "only"; draw(); } },
          h("span", {}, h("b", {}, `Unit ${pick.unit} only`), h("br"), h("small", { class: "muted" }, `The tenses and moods new in Unit ${pick.unit}, on every verb from Units 1–${pick.unit}`))),
        h("button", { class: "choice", "aria-pressed": String(pick.mode === "through"), onclick: () => { pick.mode = "through"; draw(); } },
          h("span", {}, h("b", {}, `Everything through Unit ${pick.unit}`), h("br"), h("small", { class: "muted" }, `All vocabulary and tenses from Units 1–${pick.unit}`)))),
      h("p", { class: "muted", style: { fontSize: "14px" } }, n ? `${n} forms to draw from.` : pick.mode === "only" ? `Unit ${pick.unit} adds no new active tense or mood the drill covers. Try “Everything through Unit ${pick.unit}”.` : "No verb forms for this choice yet. Units 2 and up have them."),
      h("button", { class: "btn primary", disabled: !n, onclick: () => {
        drillStore.set("drill-scope", pick);
        location.hash = `#/drill/${pick.unit}/${pick.mode}`;
      } }, "Start quiz →"));
  }
  draw();
  app().replaceChildren(
    h("div", { class: "row" }, h("a", { href: "#/", class: "muted" }, "← Home")),
    h("h1", { style: { marginTop: "8px" } }, "Verb drill"),
    h("p", { class: "muted", style: { marginTop: 0, fontSize: "14px" } },
      "Endless questions on the verb forms from H&Q's Units 2–3 sections (present, imperfect, future, aorist, perfect; subjunctive, optative, infinitive), across the vocabulary of whatever units you choose. ",
      "Forms printed in H&Q show their page. Every other form is ⚙ built by rule from H&Q's principal parts and endings, and is labeled that way."),
    body);
}

function drillRun(scope) {
  document.title = `Unit ${scope.unit}${scope.mode === "only" ? " only" : ""} · Verb drill`;
  const settings = drillStore.get("drill-settings", { cats: DRILL_CATS.map(c => c[0]), types: DRILL_TYPES.map(t => t[0]), grading: "strict", own: true });
  // Switch on question types added since these settings were saved.
  settings.types = settings.types.filter(t => DRILL_TYPES.some(d => d[0] === t));
  if (!settings.types.length) settings.types = DRILL_TYPES.map(t => t[0]);
  delete settings.knownTypes;
  const stats = drillStore.get("drill-stats", {});
  const st = { recent: [], answered: 0, right: 0, streak: 0, cur: null };
  const saveSettings = () => drillStore.set("drill-settings", settings);

  const score = h("div", { class: "tally" });
  const stage = h("div", {});
  const settingsBox = h("details", { class: "panel drill-settings" });
  const drawScore = () => score.replaceChildren(
    h("span", {}, `${st.right} / ${st.answered} right`),
    h("span", {}, st.streak > 1 ? `streak ${st.streak}` : ""));

  app().replaceChildren(
    h("div", { class: "row" }, h("a", { href: "#/", class: "muted" }, "← Home")),
    h("div", { class: "row", style: { marginTop: "8px" } },
      h("h1", { style: { flex: "1" } }, scope.mode === "only" ? `New in Unit ${scope.unit}` : `Units 1–${scope.unit}`),
      h("a", { class: "btn small", href: "#/drill" }, "Change unit"),
      h("button", { class: "btn small", onclick: () => ownModal() }, "Your paradigms")),
    settingsBox, score, stage);

  function drawSettings() {
    const toggle = (list, key) => {
      const on = list.includes(key);
      return h("button", { class: "btn small", "aria-pressed": String(on), onclick: () => {
        const i = list.indexOf(key);
        if (i >= 0) { if (list.length > 1) list.splice(i, 1); } else list.push(key);
        saveSettings(); drawSettings(); next();
      } });
    };
    const open = settingsBox.open;
    settingsBox.replaceChildren(
      h("summary", {}, "Settings"),
      h("div", { class: "options", style: { marginTop: "12px" } },
        h("b", {}, "Sections"),
        h("div", { class: "row" }, DRILL_CATS.map(([k, label]) => append(toggle(settings.cats, k), [label]))),
        h("b", {}, "Question types"),
        h("div", { class: "row" }, DRILL_TYPES.map(([k, label, sub]) => append(toggle(settings.types, k), [label]))),
        h("div", { class: "muted", style: { fontSize: "13px" } }, DRILL_TYPES.map(t => h("div", {}, h("b", {}, t[1]), ": ", t[2]))),
        h("b", {}, "Typed answers"),
        h("div", { class: "row" },
          ["strict", "lenient"].map(g => h("button", { class: "btn small", "aria-pressed": String(settings.grading === g),
            onclick: () => { settings.grading = g; saveSettings(); drawSettings(); } }, g === "strict" ? "Accents count" : "Ignore accents"))),
        h("label", {}, h("input", { type: "checkbox", checked: settings.own, onchange: e => { settings.own = e.target.checked; saveSettings(); next(); } }),
          `Include your own tagged paradigms (${drillPoolCache?.own.length || 0} forms)`),
        h("div", { class: "row" },
          h("button", { class: "btn small ghost", onclick: () => confirmModal("Reset drill history?",
            "Forget which forms you've missed, so every form is weighted equally again.", "Reset",
            () => { for (const k of Object.keys(stats)) delete stats[k]; drillStore.set("drill-stats", stats); toast("History reset"); }) }, "Reset history"))));
    settingsBox.open = open;
  }

  // Unit N only: the tenses and moods Unit N introduces, on all vocabulary from Units 1–N.
  // Through Unit N: all vocabulary and tenses from Units 1–N. Your own tables are always in.
  const inScope = it => it.src === "own" || (it.vocabUnit <= scope.unit &&
    (scope.mode === "only" ? it.tenseUnit === scope.unit : it.tenseUnit <= scope.unit));
  const pool = () => (settings.own ? drillPoolCache.book.concat(drillPoolCache.own) : drillPoolCache.book)
    .filter(it => inScope(it) && settings.cats.includes(catOf(it)));
  const allItems = () => drillPoolCache.book.concat(drillPoolCache.own);
  // Every item (any section) that prints this exact form: one form can have several parses.
  const byLemma = new Map();
  const lemmaItems = lemma => {
    if (!byLemma.has(lemma)) byLemma.set(lemma, allItems().filter(it => it.lemma === lemma && (it.src === "own" || it.tenseUnit <= scope.unit)));
    return byLemma.get(lemma);
  };
  const parsesOf = (form, lemma) => lemmaItems(lemma).filter(it => it.forms.some(f => baseNorm(f) === baseNorm(form)));

  function weight(it) {
    const s = stats[it.id];
    if (!s) return 2;
    return (s.missed ? 4 : 0) + 1 / (1 + s.streak);
  }
  function choose(items) {
    const fresh = items.filter(it => !st.recent.includes(it.id));
    const cand = fresh.length ? fresh : items;
    let r = Math.random() * cand.reduce((a, it) => a + weight(it), 0);
    for (const it of cand) { r -= weight(it); if (r <= 0) return it; }
    return cand[cand.length - 1];
  }
  function record(it, ok) {
    const s = stats[it.id] || (stats[it.id] = { seen: 0, right: 0, streak: 0, missed: false });
    s.seen++; if (ok) { s.right++; s.streak++; if (s.streak >= 2) s.missed = false; } else { s.streak = 0; s.missed = true; }
    drillStore.set("drill-stats", stats);
    st.answered++; if (ok) { st.right++; st.streak++; } else st.streak = 0;
    drawScore();
  }

  function next() {
    state.onKey = null;
    const items = pool();
    if (!items.length) {
      stage.replaceChildren(h("div", { class: "empty" }, "No forms in this unit for the chosen sections. Pick another unit or turn on a section in Settings."));
      return;
    }
    // Pick a question type that the chosen item supports.
    for (let tries = 0; tries < 30; tries++) {
      const it = choose(items);
      const types = settings.types;
      if (!types.length) continue;
      st.recent = [it.id, ...st.recent].slice(0, Math.min(6, Math.floor(items.length / 2)));
      const t = pick1(types);
      st.cur = it;
      return ({ parse: askParse, pick: askPick, build: askBuild }[t] || askParse)(it);
    }
    stage.replaceChildren(h("div", { class: "empty" }, "No question fits these forms. Turn on another question type or section."));
  }

  // ---- shared pieces
  const source = it => it.src === "book"
    ? `Printed in H&Q ${it.section}, p. ${it.page} (PDF p. ${it.page + 19})`
    : it.src === "built"
    ? `⚙ Built by rule: Unit ${it.vocabUnit} vocab principal parts + ${it.section} endings. Not printed in H&Q, so check it before you rely on it.`
    : `your card “${it.cardTitle}” in ${it.deckName}`;
  function answerBlock(form, it) {
    const parses = parsesOf(form, it.lemma);
    return h("div", {}, parses.map(p => h("div", { class: "drill-parse" },
      h("div", { class: "ans" }, p.forms.join(" / ")),
      h("div", {}, h("b", {}, describe(p)), " of ", h("span", { class: "greek" }, p.lemma)),
      p.english ? h("div", {}, "“" + p.english + "”",
          isClause(p) ? h("span", { class: "muted", style: { fontSize: "13px" } }, " · as in a purpose clause (§36: subjunctive “may”, optative “might”). H&Q gives no paradigm translation.") : null)
        : null,
      h("div", { class: "muted", style: { fontSize: "13px" } }, source(p)))),
      parses.length > 1 ? h("div", { class: "muted", style: { fontSize: "13px" } }, `This form has ${parses.length} possible parses; context decides.`) : null);
  }
  const nextBtn = () => {
    const b = h("button", { class: "btn primary", onclick: next }, "Next →");
    state.onKey = e => { if (e.key === "Enter" && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); next(); } };
    setTimeout(() => b.focus(), 0);
    return h("div", { class: "row", style: { marginTop: "14px" } }, b);
  };
  const frame = (label, prompt, body) => stage.replaceChildren(h("div", { class: "qcard" },
    h("div", { class: "qlabel" }, label, st.cur?.src === "built" ? h("span", { class: "built-badge", title: "Built by rule, not printed in H&Q" }, "⚙ built") : null), h("div", { class: "prompt" }, prompt), body));
  const bigGreek = s => h("div", { class: "card-text greek size-xl", lang: "grc" }, s);
  const descPrompt = it => h("div", {}, h("div", { class: "card-text greek size-l", lang: "grc" }, it.lemma),
    h("div", { class: "size-m" }, describe(it)));

  // ---- Parse it
  function askParse(it) {
    const form = pick1(it.forms);
    const pickd = { tense: null, mood: null, person: null, number: null };
    const fb = h("div", {});
    const groups = h("div", { class: "drill-groups" });
    let done = false;
    const isInf = () => pickd.mood === "infinitive";
    // Every Greek form with a set English also needs its translation typed.
    const engParses = parsesOf(form, it.lemma).filter(p => p.english);
    const eng = engParses.length ? h("input", { class: "field", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
      placeholder: "Type the English", "aria-label": "English translation", oninput: () => draw() }) : null;
    const ready = () => pickd.tense && pickd.mood && (isInf() || (pickd.person && pickd.number)) && (!eng || eng.value.trim());
    const check = h("button", { class: "btn primary", disabled: true, onclick: () => grade() }, "Check");
    function draw() {
      const grp = (key, values, labels, disabled) => h("div", { class: "drill-group" },
        h("div", { class: "lbl" }, key[0].toUpperCase() + key.slice(1)),
        h("div", { class: "row" }, values.map((v, i) => h("button", { class: "btn small", disabled: disabled || done,
          "aria-pressed": String(pickd[key] === v), onclick: () => { pickd[key] = v; draw(); } }, labels[i]))));
      groups.replaceChildren(
        grp("tense", TENSES, TENSES), grp("mood", MOODS, MOODS),
        grp("person", [1, 2, 3], PERSONS, isInf()), grp("number", NUMBERS, NUMBERS, isInf()));
      check.disabled = !ready() || done;
    }
    function grade() {
      if (!ready() || done) return;
      done = true;
      const guess = { tense: pickd.tense, mood: pickd.mood, person: isInf() ? null : pickd.person, number: isInf() ? null : pickd.number };
      const okParse = parsesOf(form, it.lemma).some(p => sameParse(p, guess));
      const en = eng ? gradeEnglish(eng.value, engParses) : { ok: true };
      if (eng) eng.disabled = true;
      const ok = okParse && en.ok;
      record(it, ok);
      draw();
      const verdict = ok ? "Correct!" : !eng ? "Not quite."
        : `Parse ${okParse ? "✓" : "✗"} · English ${en.ok ? "✓" : "✗"}` + (en.note ? ` (${en.note})` : "");
      fb.replaceChildren(h("div", { class: "feedback " + (ok ? "good" : "bad") }, verdict,
        h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, answerBlock(form, it))), nextBtn());
    }
    draw();
    state.onKey = e => { if (e.key === "Enter" && ready() && !done) { e.preventDefault(); grade(); } };
    frame("Parse & translate: active voice", bigGreek(form), h("div", {}, groups,
      eng ? h("div", { class: "drill-group" }, h("div", { class: "lbl" }, "English"), eng,
        h("div", { class: "muted", style: { fontSize: "13px", marginTop: "4px" } }, isClause(it)
          ? "Translate as in a purpose clause (§36): subjunctive “may …”, optative “might …”. A leading “(in order) that” is optional."
          : "Any H&Q-style rendering counts (“I was …ing” or “I used to …”). Mark plural you as “you all”, “y'all” or “you (pl.)”.")) : null, h("div", { class: "row", style: { marginTop: "12px" } }, check), fb));
  }

  // ---- multiple choice helper
  function choiceQuestion(label, prompt, options, correctIdx, it, form, greekOptions) {
    const fb = h("div", {});
    let done = false;
    const buttons = options.map((o, i) => h("button", { class: "choice" + (greekOptions ? "" : " drill-eng"), onclick: () => choose(i) },
      h("span", { class: "num" }, i + 1), h("span", greekOptions ? { lang: "grc" } : {}, o)));
    function choose(i) {
      if (done) return;
      done = true;
      const ok = i === correctIdx;
      buttons[correctIdx].classList.add("right");
      if (!ok) buttons[i].classList.add("wrong");
      record(it, ok);
      fb.replaceChildren(h("div", { class: "feedback " + (ok ? "good" : "bad") }, ok ? "Correct!" : "Not quite.",
        h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, answerBlock(form, it))), nextBtn());
    }
    state.onKey = e => { const n = Number(e.key); if (!done && n >= 1 && n <= options.length) choose(n - 1); };
    frame(label, prompt, h("div", {}, h("div", { class: "choices" }, buttons), fb));
  }
  const nearness = (a, b) => (a.tense === b.tense) + (a.mood === b.mood) + 2 * (a.person === b.person && a.number === b.number);
  function distractors(it, candidates, n, key) {
    const scored = shuffle(candidates).sort((a, b) => nearness(it, b) - nearness(it, a));
    const out = [], seen = new Set();
    for (const c of scored) {
      const k = key(c);
      if (seen.has(k)) continue;
      seen.add(k); out.push(c);
      if (out.length >= n * 2) break;
    }
    return shuffle(out).slice(0, n);
  }

  // ---- Find it
  function askPick(it) {
    const form = pick1(it.forms);
    // A distractor must not also fit the description (e.g. a form shared by two parses).
    const cands = lemmaItems(it.lemma).filter(o => !o.forms.some(f => it.forms.includes(f))
      && !parsesOf(o.forms[0], o.lemma).some(p => sameParse(p, it)));
    const ds = distractors(it, cands, 3, o => o.forms[0]).map(o => pick1(o.forms));
    const options = shuffle([form, ...ds]);
    choiceQuestion("Find it", descPrompt(it), options, options.indexOf(form), it, form, true);
  }

  // ---- Write it
  function askBuild(it) {
    const fb = h("div", {});
    let done = false;
    const inp = h("input", { class: "field", "data-greek": "", lang: "grc", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
      placeholder: "Type the Greek form", "aria-label": "Greek form" });
    const check = () => {
      if (done || !inp.value.trim()) return;
      done = true; inp.disabled = true;
      // Vowel length isn't tested: macrons/breves are shown in answers but never required.
      const results = it.forms.map(f => grade(noLength(inp.value), noLength(f), settings.grading));
      const res = results.includes("right") ? "right" : results.includes("close") ? "close" : "wrong";
      record(it, res === "right");
      fb.replaceChildren(h("div", { class: "feedback " + (res === "right" ? "good" : res === "close" ? "close" : "bad") },
        res === "right" ? "Correct!" : res === "close" ? "Close: check the accents, breathings and iota subscripts." : "Not quite.",
        h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, answerBlock(it.forms[0], it))), nextBtn());
    };
    state.onKey = e => { if (e.key === "Enter" && !done) { e.preventDefault(); check(); } };
    frame("Write it", descPrompt(it), h("div", {}, inp,
      h("div", { class: "muted", style: { fontSize: "13px", marginTop: "6px" } }, "Optional letters like (ν) can be typed or left out."),
      h("div", { class: "row", style: { marginTop: "12px" } }, h("button", { class: "btn primary", onclick: check }, "Check")), fb));
    setTimeout(() => inp.focus(), 0);
  }

  // ---- Tag your own table cards for the drill
  async function ownModal() {
    const decks = [];
    for (const meta of await api.list()) decks.push(normalizeDeck(await api.get(meta.id)));
    const tables = decks.flatMap(d => d.cards.filter(c => isTable(c) && c.rows.length === 3 && c.cols.length === 2).map(c => ({ d, c })));
    const sel = (opts, val, on) => h("select", { class: "field", onchange: e => on(e.target.value) },
      opts.map(o => h("option", { value: o, selected: o === val }, o)));
    const rows = tables.map(({ d, c }) => {
      const tag = c.drill ? { ...c.drill } : { lemma: "", tense: "present", mood: "indicative" };
      const on = h("input", { type: "checkbox", checked: !!c.drill });
      const lemma = h("input", { class: "field", "data-greek": "", lang: "grc", value: tag.lemma, placeholder: "Verb label (your text)" });
      return { d, c, on, lemma, tag, el: h("div", { class: "panel drill-own" },
        h("label", {}, on, h("b", { class: "greek" }, c.title || "(untitled table)"), h("span", { class: "muted" }, " · " + d.name)),
        h("div", { class: "drill-own-fields" }, lemma,
          sel(TENSES, tag.tense, v => tag.tense = v), sel(MOODS.slice(0, 3), tag.mood, v => tag.mood = v))) };
    });
    modal("Your paradigms", h("div", {},
      h("p", { class: "muted", style: { fontSize: "14px" } },
        "Tick any 3×2 person × number table you wrote, and say which tense and mood it is. Each cell becomes a form in the drill. ",
        "Write alternatives as “a / b”. Endings-only tables will be quizzed as endings."),
      tables.length ? h("div", { class: "drill-own-list" }, rows.map(r => r.el))
        : h("p", {}, "No 3×2 tables yet. Make one in any deck with the Verb layout.")),
    close => [h("button", { class: "btn", onclick: close }, "Cancel"),
      h("button", { class: "btn primary", onclick: async () => {
        const touched = new Set();
        for (const r of rows) {
          const nextTag = r.on.checked ? { lemma: nfc(r.lemma.value.trim()) || r.c.title, tense: r.tag.tense, mood: r.tag.mood } : null;
          if (JSON.stringify(nextTag) !== JSON.stringify(r.c.drill || null)) {
            if (nextTag) r.c.drill = nextTag; else delete r.c.drill;
            touched.add(r.d);
          }
        }
        for (const d of touched) { d.updated = Date.now(); await api.save(d); }
        close();
        drillPoolCache = await loadDrillPool();
        byLemma.clear();
        if (state.deck) state.deck = null;
        drawSettings(); next();
        toast(touched.size ? "Saved" : "No changes");
      } }, "Save")]);
  }

  drawSettings(); drawScore(); next();
}

// ---- grading typed English
// Normalizes both sides: case, punctuation, contractions, shall/will, "you all"/"y'all" → plural you,
// he/she/it → any one of them, and drops H&Q's bracketed notes like "(simple aspect)".
const EN_CONTRACT = [[/\bi'm\b/g, "i am"], [/\b(you|we|they)'re\b/g, "$1 are"], [/\b(\w+)'ll\b/g, "$1 will"],
  [/\b(i|you|we|they)'ve\b/g, "$1 have"], [/\b(he|she|it)'s been\b/g, "$1 has been"], [/\b(he|she|it)'s\b/g, "$1 is"], [/\bweren't\b/g, "were not"], [/\bwasn't\b/g, "was not"]];
function enNorm(s) {
  let t = " " + String(s).toLowerCase().replace(/[’‘`]/g, "'") + " ";
  t = t.replace(/\((sg|sing|singular)\.?\)/g, " you_sg_mark ").replace(/\((pl|plur|plural)\.?\)/g, " you_pl_mark ");
  t = t.replace(/\(([^)]*)\)/g, " $1 ").replace(/\b(simple|progressive\/repeated|completed) aspect\b/g, " ");
  for (const [re, r] of EN_CONTRACT) t = t.replace(re, r);
  t = t.replace(/\s+/g, " ").replace(/\by'all\b|\byou all\b|\byou guys\b|\byouse\b|\byou-all\b/g, "you_pl").replace(/\byou_pl you_pl_mark\b/g, "you_pl");
  t = t.replace(/\byou you_pl_mark\b|\byou pl\b|\byou plural\b/g, "you_pl").replace(/\byou you_sg_mark\b|\byou sg\b|\byou singular\b/g, "you_sg");
  t = t.replace(/you_(sg|pl)_mark/g, "").replace(/\bhe\/she\/it\b|\bhe or she\b|\bshe\b|\bit\b|\bhe\b/g, "3s");
  t = t.replace(/\bshall\b/g, "will").replace(/\bthou\b/g, "you_sg");
  t = t.replace(/[^a-z0-9_ ]+/g, " ").replace(/\s+/g, " ").trim();
  t = t.replace(/^(in order that|so that|that|in order for) /, "");
  return t.replace(/^you\b/, "you_any");
}
function gradeEnglish(given, parses) {
  const g = enNorm(given);
  if (!g) return { ok: false };
  for (const p of parses) {
    const alts = [p.english, p.also].filter(Boolean).flatMap(s => s.split(/\s+\/\s+/));
    for (const a of alts) {
      // H&Q marks "(pl.)" only on the first rendering; the parse says which you it is.
      const e = p.person === 2 ? enNorm(a).replace(/^you_any\b/, p.number === "plural" ? "you_pl" : "you_sg") : enNorm(a);
      if (e === g) return { ok: true };
      // Bare "you" is fine for singular; for plural, say which.
      if (e.startsWith("you_sg") && g.startsWith("you_any") && e.slice(6) === g.slice(7)) return { ok: true };
      if (e.startsWith("you_pl") && g.startsWith("you_any") && e.slice(6) === g.slice(7))
        return { ok: false, note: "Right verb and tense, but this you is plural: write “you all”." };
    }
  }
  return { ok: false };
}

/* Ending tables: an endless drill of the bare personal endings for each tense and
   mood, laid out as a person × number grid (1st/2nd/3rd rows, singular/plural columns).
   The endings are DERIVED from H&Q's printed παιδεύω paradigm (drill-pool.json) by
   stripping the stem — nothing is invented, and a cell is only shown if it derives
   cleanly. Accents are never graded (endings stand alone); iota subscripts are, so the
   subjunctive -ῃς is distinct from the indicative -εις. Wrapped in an IIFE so it never
   clashes with the verb drill's globals; it reuses loadDrillPool / drillPoolCache /
   catOf / DRILL_CATS / SLOT / PERSONS / variants. */
"use strict";
(function () {
  // Infinitives have no person × number grid, so drop that section here.
  const TABLE_CATS = DRILL_CATS.filter(([k]) => k !== "inf");
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
  const tmLabel = t => `${cap(t.tense)} ${t.mood} active`;

  // How each tense/mood is formed — transcribed from the vault's §20–§34 notes.
  const FORMATION = {
    "present|indicative": "Principal Part I − ω = present stem, then the primary active endings.",
    "imperfect|indicative": "Augment ἐ- + present stem (PP I), then the secondary active endings.",
    "future|indicative": "Principal Part II − ω = future stem, then the same endings as the present (no augment — the future is a primary tense).",
    "aorist|indicative": "Principal Part III − α = augmented aorist stem (the augment is already built in), then the aorist active endings.",
    "perfect|indicative": "PP IV − α = perfect stem (no augment; reduplication builds it), then the same endings as the aorist — except 3rd pl. -ᾱσι(ν).",
    "present|subjunctive": "Present stem (PP I − ω), then the present endings with the thematic vowel lengthened (ο → ω, ε → η).",
    "aorist|subjunctive": "Unaugmented aorist stem (PP III − α, drop the augment), then the same endings as the present subjunctive.",
    "present|optative": "Present stem, then endings that all begin with -οι- (thematic ο + optative ι).",
    "aorist|optative": "Unaugmented aorist stem (drop the augment), then endings that all begin with -αι- (2nd/3rd sg. and 3rd pl. have alternatives).",
  };
  const formationBlock = t => {
    const txt = FORMATION[`${t.tense}|${t.mood}`];
    return txt ? h("div", { class: "formation", lang: "grc" }, h("b", {}, "Formation: "), txt) : null;
  };

  const tStore = {
    get(key, dflt) { try { return Object.assign(dflt, JSON.parse(localStorage.getItem(key) || "{}")); } catch { return dflt; } },
    set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch { /* private mode */ } },
  };

  // Strip accents/breathings/macrons (but NOT the iota subscript, U+0345) so an ending
  // can be compared and derived regardless of the accent a real word would carry.
  const MARKS = /[̀́͂̓̔̄̆̈]/g;
  const deAccent = s => nfc(s).normalize("NFD").replace(MARKS, "").normalize("NFC");
  // What to strip off each παιδεύω form to leave the bare PERSONAL ending: the verb stem,
  // plus any augment/reduplication, plus the TENSE/ASPECT marker (future & aorist σ, perfect
  // κ) — those are not part of the ending. Mood markers (the subjunctive long vowel, the
  // optative -οι-/-αι-) are kept, since they belong to the ending.
  function stemFor(tense, mood) {
    let base = "παιδευ";
    if (mood === "indicative" && (tense === "imperfect" || tense === "aorist")) base = "επαιδευ";   // augment
    else if (mood === "indicative" && tense === "perfect") base = "πεπαιδευ";                        // reduplication
    if (tense === "future" || tense === "aorist") base += "σ";
    else if (tense === "perfect") base += "κ";
    return base;
  }
  function endingOf(form, tense, mood) {
    const d = deAccent(form), stem = stemFor(tense, mood);
    return d.startsWith(stem) ? d.slice(stem.length) : null;   // null = couldn't derive; skip
  }
  // For grading: drop accents + parentheses + spaces, normalize final sigma; keep subscript.
  const norm = s => deAccent(String(s)).toLowerCase().replace(/[()\s]/g, "").replace(/ς/g, "σ");
  function endingAccepts(given, endings) {
    const g = norm(given);
    if (!g) return false;
    for (const e of endings) for (const v of variants(nfc(e))) if (norm(v) === g) return true;
    return false;
  }

  const inScope = (it, scope) => scope.mode === "only" ? it.tenseUnit === scope.unit : it.tenseUnit <= scope.unit;

  // One ending table per (tense, mood) that H&Q's παιδεύω prints, in scope + switched-on
  // sections, excluding infinitives. Each cell holds the acceptable ending spellings.
  function collectTables(scope, settings) {
    const groups = new Map();
    for (const it of drillPoolCache.book) {
      if (it.src !== "book" || it.mood === "infinitive" || it.person == null) continue;
      const key = `${it.tense}|${it.mood}`;
      if (!groups.has(key)) groups.set(key, {});
      groups.get(key)[`${it.person}|${it.number}`] = it;
    }
    const tables = [];
    for (const [key, slots] of groups) {
      const flat = SLOT.map(([p, n]) => slots[`${p}|${n}`]);
      if (flat.some(x => !x)) continue;
      const first = flat[0];
      if (!inScope(first, scope) || !settings.cats.includes(catOf(first))) continue;
      // cells[r][c]: r = person-1, c = 0 singular / 1 plural; each is the list of endings.
      let ok = true;
      const cells = [0, 1, 2].map(r => [0, 1].map(c => {
        const it = slots[`${r + 1}|${c === 0 ? "singular" : "plural"}`];
        const ends = it.forms.map(f => endingOf(f, it.tense, it.mood)).filter(e => e != null);
        if (!ends.length) ok = false;
        return [...new Set(ends)];
      }));
      if (!ok) continue;
      tables.push({ id: `e:${key}`, tense: first.tense, mood: first.mood, section: catOf(first),
        page: first.page, sectionName: first.section, cells });
    }
    return tables;
  }

  // #/tables asks what to test; #/tables/<unit>/<only|through> starts straight away.
  async function tableDrillView(unitArg, modeArg) {
    document.title = "Ending tables · Flashcards";
    const unit = Number(unitArg), mode = modeArg === "only" ? "only" : modeArg === "through" ? "through" : null;
    if (!drillPoolCache) {
      app().replaceChildren(h("div", { class: "empty" }, "Loading…"));
      try { drillPoolCache = await loadDrillPool(); }
      catch (e) { return app().replaceChildren(h("div", { class: "empty" }, "Couldn't load the drill: " + e.message)); }
    }
    if (!unit || !mode) return tableStart();
    return tableRun({ unit, mode });
  }

  function settingsFor() {
    const settings = tStore.get("tables-settings", { cats: TABLE_CATS.map(c => c[0]), view: "type" });
    settings.cats = (settings.cats || []).filter(c => TABLE_CATS.some(x => x[0] === c));
    if (!settings.cats.length) settings.cats = TABLE_CATS.map(c => c[0]);
    if (settings.view !== "cards") settings.view = "type";
    return settings;
  }

  // The filled endings grid, used by the quiz reveal and the flashcard back.
  function endingsTableEl(t) {
    const rows = [0, 1, 2].map(r => h("tr", {}, h("th", { scope: "row" }, PERSONS[r]),
      [0, 1].map(c => h("td", { class: "ok", lang: "grc" }, t.cells[r][c].join(" / ")))));
    return h("div", { class: "ptable-wrap" }, h("table", { class: "ptable etable" },
      h("thead", {}, h("tr", {}, h("th", {}, "Person"), h("th", { scope: "col" }, "Singular"), h("th", { scope: "col" }, "Plural"))),
      h("tbody", {}, rows)));
  }

  function tableStart() {

    const settings = settingsFor();

    const units = Array.from({ length: 19 }, (_, i) => i + 2);   // verbs start at Unit 2

        h("h2", { style: { marginTop: "16px" } }, "1. Which unit are you on?"),
        h("div", { class: "drill-units" }, units.map(u => h("button", { class: "btn", "aria-pressed": String(pick.unit === u),
          onclick: () => { pick.unit = u; draw(); } }, String(u)))),
        h("h2", {}, "2. What should it cover?"),
        h("div", { class: "drill-scope" },
          h("button", { class: "choice", "aria-pressed": String(pick.mode === "only"), onclick: () => { pick.mode = "only"; draw(); } },
            h("span", {}, h("b", {}, `Unit ${pick.unit} only`), h("br"), h("small", { class: "muted" }, `Only the tenses and moods new in Unit ${pick.unit}`))),
          h("button", { class: "choice", "aria-pressed": String(pick.mode === "through"), onclick: () => { pick.mode = "through"; draw(); } },
            h("span", {}, h("b", {}, `Everything through Unit ${pick.unit}`), h("br"), h("small", { class: "muted" }, `All tenses and moods from Units 1–${pick.unit}`)))),
        h("p", { class: "muted", style: { fontSize: "14px" } }, n ? `${n} ending table${n === 1 ? "" : "s"} to drill.` : pick.mode === "only" ? `Unit ${pick.unit} adds no new active tense or mood. Try “Everything through Unit ${pick.unit}”.` : "No ending tables for this choice yet. Units 2 and up have them."),
        h("button", { class: "btn primary", disabled: !n, onclick: () => {

          location.hash = `#/tables/${pick.unit}/${pick.mode}`;
        } }, "Start →"));

      h("div", { class: "row" }, h("a", { href: "#/", class: "muted" }, "← Home")),
      h("h1", { style: { marginTop: "8px" } }, "Ending tables"),
      h("p", { class: "muted", style: { marginTop: 0, fontSize: "14px" } },
        "Fill in the bare personal endings for one tense and mood — all six, in a person × number grid. ",
        "Endings are taken from H&Q's παιδεύω paradigm. Accents aren't graded (an ending has none on its own); iota subscripts are."),
      body);
  }

  function tableRun(scope) {
    document.title = `Unit ${scope.unit}${scope.mode === "only" ? " only" : ""} · Ending tables`;
    const settings = settingsFor();
    const stats = tStore.get("tables-stats", {});
    const st = { recent: [], answered: 0, right: 0, streak: 0, cur: null };
    const saveSettings = () => tStore.set("tables-settings", settings);

    const score = h("div", { class: "tally" });
    const stage = h("div", {});

    const drawScore = () => score.replaceChildren(

    const modeRow = h("div", { class: "row", style: { marginTop: "8px", gap: "8px" } });
    app().replaceChildren(
      h("div", { class: "row" }, h("a", { href: "#/", class: "muted" }, "← Home")),

        } });
      };
      const open = settingsBox.open;
      settingsBox.replaceChildren(
        h("summary", {}, "Settings"),
        h("div", { class: "options", style: { marginTop: "12px" } },

          h("div", { class: "row" }, TABLE_CATS.map(([k, label]) => append(toggle(settings.cats, k), [label]))),
          h("div", { class: "muted", style: { fontSize: "13px" } }, "Endings are graded without accents; iota subscripts (ῃ, ῳ) count. Type them with the accent bar. Optional letters like (ν) can be included or left out."),
          h("div", { class: "row" },
            h("button", { class: "btn small ghost", onclick: () => confirmModal("Reset table history?",
              "Forget which tables you've missed, so every table is weighted equally again.", "Reset",
              () => { for (const k of Object.keys(stats)) delete stats[k]; tStore.set("tables-stats", stats); toast("History reset"); }) }, "Reset history"))));
      settingsBox.open = open;
    }

    const pool = () => collectTables(scope, settings);

    function weight(t) {
      const s = stats[t.id];
      if (!s) return 2;
      return (s.missed ? 4 : 0) + 1 / (1 + s.streak);
    }
    function choose(items) {
      const fresh = items.filter(t => !st.recent.includes(t.id));
      const cand = fresh.length ? fresh : items;
      let r = Math.random() * cand.reduce((a, t) => a + weight(t), 0);
      for (const t of cand) { r -= weight(t); if (r <= 0) return t; }
      return cand[cand.length - 1];
    }
    function record(t, ok) {
      const s = stats[t.id] || (stats[t.id] = { seen: 0, right: 0, streak: 0, missed: false });
      s.seen++; if (ok) { s.right++; s.streak++; if (s.streak >= 2) s.missed = false; } else { s.streak = 0; s.missed = true; }
      tStore.set("tables-stats", stats);
      st.answered++; if (ok) { st.right++; st.streak++; } else st.streak = 0;
      drawScore();
    }

    function next() {
      state.onKey = null;
      const items = pool();
      if (!items.length) {
        stage.replaceChildren(h("div", { class: "empty" }, "No ending tables in this unit for the chosen sections. Pick another unit or turn on a section in Settings."));
        return;
      }
      const t = choose(items);
      st.recent = [t.id, ...st.recent].slice(0, Math.min(6, Math.floor(items.length / 2)));
      st.cur = t;
      ask(t);
    }

    const source = t => `Endings from H&Q's παιδεύω ${t.sectionName}, p. ${t.page} (PDF p. ${t.page + 19})`;

    function ask(t) {
      const fb = h("div", {});
      let done = false;
      const inputs = {};
      const holder = h("div", {});
      const headRow = () => h("tr", {}, h("th", {}, "Person"), h("th", { scope: "col" }, "Singular"), h("th", { scope: "col" }, "Plural"));

      function grid() {
        const rows = [0, 1, 2].map(r => h("tr", {}, h("th", { scope: "row" }, PERSONS[r]),
          [0, 1].map(c => {
            const inp = h("input", { class: "field", "data-greek": "", lang: "grc", "data-r": r, "data-c": c, autocomplete: "off",
              autocapitalize: "off", spellcheck: "false", "aria-label": `${PERSONS[r]} ${c === 0 ? "singular" : "plural"} ending` });
            inputs[`${r},${c}`] = inp;
            return h("td", {}, inp);
          })));
        return h("div", { class: "ptable-wrap" }, h("table", { class: "ptable etable" }, h("thead", {}, headRow()), h("tbody", {}, rows)));
      }

      const order = [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1]];
      const focusCell = idx => { const [r, c] = order[idx] || []; inputs[`${r},${c}`]?.focus(); };

      function check() {
        if (done) return;
        done = true;
        const values = [0, 1, 2].map(r => [0, 1].map(c => inputs[`${r},${c}`].value));
        const results = [0, 1, 2].map(r => [0, 1].map(c => endingAccepts(values[r][c], t.cells[r][c])));
        const allRight = results.every(row => row.every(Boolean));
        record(t, allRight);
        const rows = [0, 1, 2].map(r => h("tr", {}, h("th", { scope: "row" }, PERSONS[r]),
          [0, 1].map(c => {
            const td = h("td", { class: results[r][c] ? "ok" : "bad" }, values[r][c].trim() || "—");
            if (!results[r][c]) td.append(h("span", { class: "fix", lang: "grc" }, t.cells[r][c].join(" / ")));
            return td;
          })));
        holder.replaceChildren(h("div", { class: "ptable-wrap" }, h("table", { class: "ptable etable" }, h("thead", {}, headRow()), h("tbody", {}, rows))));
        fb.replaceChildren(h("div", { class: "feedback " + (allRight ? "good" : "bad") },
          allRight ? "All six correct!" : "Not all right — the correct endings are shown in each wrong cell.",
          h("div", { style: { color: "var(--ink)", fontWeight: 400 } }, formationBlock(t)),
          h("div", { style: { color: "var(--ink)", fontWeight: 400, marginTop: "8px", fontSize: "13px" } }, source(t))),
          nextBtn());
      }

      const checkBtn = h("button", { class: "btn primary", onclick: check }, "Check");
      holder.replaceChildren(grid());
      stage.replaceChildren(h("div", { class: "qcard" },
        h("div", { class: "qlabel" }, "Ending table"),
        h("div", { class: "prompt" }, h("div", { class: "size-l" }, tmLabel(t)),
          h("div", { class: "size-m muted" }, "Type the six personal endings")),
        holder,
        h("div", { class: "muted", style: { fontSize: "13px", marginTop: "6px" } }, "Enter moves to the next cell; Enter on the last one checks."),
        h("div", { class: "row", style: { marginTop: "12px" } }, checkBtn),
        fb));

      holder.addEventListener("keydown", e => {
        if (e.key !== "Enter" || done) return;
        e.preventDefault(); e.stopPropagation();
        const r = +e.target.dataset.r, c = +e.target.dataset.c;
        const idx = order.findIndex(([rr, cc]) => rr === r && cc === c);
        if (idx >= 0 && idx < order.length - 1) focusCell(idx + 1); else check();
      });
      state.onKey = null;
      setTimeout(() => focusCell(0), 0);

    const nextBtn = () => {
      const b = h("button", { class: "btn primary", onclick: next }, "Next →");
      state.onKey = e => { if (e.key === "Enter" && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); next(); } };

      return h("div", { class: "row", style: { marginTop: "14px" } }, b);

    // ---- Flashcard review: front = tense/mood, tap to flip to the filled table.
    let deck = [], pos = 0, flipped = false;

        ? h("div", {}, endingsTableEl(t), formationBlock(t),
            h("div", { class: "muted", style: { fontSize: "13px", marginTop: "8px" } }, source(t)))
        : h("div", { class: "empty", style: { padding: "28px 10px" } }, h("div", { class: "size-m muted" }, "Tap to reveal the endings"));
      stage.replaceChildren(
        h("div", { class: "qcard", style: { cursor: "pointer" }, onclick: () => { flipped = !flipped; drawCard(); } },
          h("div", { class: "qlabel" }, "Ending table — flashcard", h("span", { class: "muted" }, `${pos + 1} / ${deck.length}`)),
          h("div", { class: "prompt" }, h("div", { class: "size-l" }, tmLabel(t))),
          face),
        h("div", { class: "row", style: { marginTop: "14px", gap: "10px" } },
          h("button", { class: "btn", onclick: e => { e.stopPropagation(); flipped = !flipped; drawCard(); } }, flipped ? "Hide" : "Flip"),
          h("button", { class: "btn primary", onclick: cardNext }, "Next →")));
      state.onKey = e => {
        if (e.key === "ArrowRight") { e.preventDefault(); cardNext(); }
        else if (e.key === " ") { e.preventDefault(); flipped = !flipped; drawCard(); }
        else if (e.key === "Enter") { e.preventDefault(); if (flipped) cardNext(); else { flipped = true; drawCard(); } }
      };
    }
    function cardNext() {
      const items = pool();
      if (!items.length) { stage.replaceChildren(h("div", { class: "empty" }, "No ending tables in this unit for the chosen sections. Pick another unit or turn on a section in Settings.")); return; }
      pos += 1;
      if (!deck.length || pos >= deck.length) { deck = shuffle(items); pos = 0; }

    }
    function cardStart() {
      const items = pool();
      if (!items.length) { stage.replaceChildren(h("div", { class: "empty" }, "No ending tables in this unit for the chosen sections. Pick another unit or turn on a section in Settings.")); return; }
      deck = shuffle(items); pos = 0; flipped = false; drawCard();
    }

    function render() {
      // .tally sets display:flex, which beats the [hidden] attribute — hide inline instead.
      if (settings.view === "cards") { score.style.display = "none"; cardStart(); }

    }

    drawModeToggle(); drawSettings(); drawScore(); render();
  }

  window.tableDrillView = tableDrillView;
})();

/* Noun drill: an endless quiz on the noun declensions built by rule from H&Q's
   vocabulary + endings (build_noun_drill.py -> noun-built.json). Every form is

(function () {

    get(key, dflt) { try { return Object.assign(dflt, JSON.parse(localStorage.getItem(key) || "{}")); } catch { return dflt; } },

    const items = [];
